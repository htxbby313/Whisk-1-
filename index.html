<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whisk – Travel Itineraries & Local Field Guides</title>
    <meta name="description" content="Build grounded custom itineraries in seconds, explore SEO & GEO travel field guides, and discover local restaurants, hotels, and hidden gems with Whisk.">
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Whisk – Travel Itineraries & Local Field Guides" />
    <meta property="og:description" content="Build grounded custom itineraries in seconds, explore local field guides, and discover verified neighborhood favorites with Whisk." />
    <meta property="og:site_name" content="Whisk" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Whisk – Travel Itineraries & Local Field Guides" />
    <meta name="twitter:description" content="Build grounded custom itineraries in seconds and discover verified local travel field guides with Whisk." />
    <link rel="icon" type="image/svg+xml" href="/whisk-logo.svg" />
    <link id="whisk-canonical" rel="canonical" />
    <script id="whisk-jsonld" type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Whisk",
        "applicationCategory": "TravelApplication",
        "operatingSystem": "All",
        "description": "Personalized travel itinerary builder and community SEO/GEO destination field guides powered by Google Search & Maps grounding.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Caveat:wght@600&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Brand – Vibrant Colors from Around the World */
            --whisk-terracotta: #FF3B30;  /* Marrakech Terracotta Red */
            --whisk-saffron: #FFC300;     /* Jaipur Saffron Gold */
            --whisk-emerald: #00D97E;     /* Bali Rainforest Emerald */
            --whisk-azure: #00B4FF;       /* Santorini Aegean Azure */
            --whisk-fuchsia: #FF1CF7;     /* Oaxaca Bougainvillea Fuchsia */

            --whisk-orange: #FF4D2E;      /* Amalfi Sunset Coral */
            --whisk-cyan: #00B4FF;        /* Santorini Azure */
            --whisk-pink: #FF1CF7;        /* Oaxaca Bougainvillea */
            --whisk-purple: #00C86B;      /* Patagonia Emerald */
            --whisk-navy: #0F172A;        /* Deep Midnight Ink */

            /* Neutrals */
            --whisk-white: #FFFFFF;
            --whisk-offwhite: #FAFAFA;
            --whisk-sky: #ECFEFF;
            --whisk-divider: #E2E8F0;

            /* Text */
            --text-primary: #0F172A;
            --text-secondary: #475569;
            --text-inverse: #FFFFFF;

            /* Backgrounds */
            --bg-primary: #FFFFFF;
            --bg-surface: #FFFFFF;
            --bg-inverse: var(--whisk-navy);
            --bg-accent: var(--whisk-sky);

            /* Actions */
            --action-primary: var(--whisk-terracotta);
            --action-secondary: var(--whisk-azure);
            --action-disabled: #CBD5E1;

            /* Glows & Shadows */
            --shadow-orange: 0 14px 36px -6px rgba(255, 59, 48, 0.55);
            --shadow-cyan: 0 14px 36px -6px rgba(0, 180, 255, 0.52);
            --focus-ring: rgba(0, 180, 255, 0.45);
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--whisk-offwhite);
            color: var(--text-primary);
            overflow-x: hidden;
        }
        h1, h2, h3, h4, h5, h6 {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }
        .vibrant-gradient {
            background: linear-gradient(135deg, #FF3B30 0%, #FF6B2B 35%, #FF1CF7 100%);
        }
        .cyan-gradient {
            background: linear-gradient(135deg, #00A8FF 0%, #00D97E 100%);
        }
        .saffron-gradient {
            background: linear-gradient(135deg, #FFC300 0%, #FF4D2E 100%);
        }
        .whisk-ombre-bg {
            background: linear-gradient(135deg, #FF3B30 0%, #FFC300 24%, #00D97E 48%, #00B4FF 74%, #FF1CF7 100%);
            background-attachment: fixed;
        }
        .whisk-text-ombre {
            background: linear-gradient(135deg, #FF3B30 0%, #FFAE00 26%, #00C86B 52%, #00A8FF 76%, #FF1CF7 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        /* Animations */
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        .shimmer-box {
            position: relative;
            overflow: hidden;
        }
        .shimmer-box::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
            animation: shimmer 1.5s infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(4deg); }
        }
        .animate-float {
            animation: float 8s ease-in-out infinite;
        }
        .animate-float-delayed {
            animation: float 10s ease-in-out infinite 2s;
        }
        .animate-float-fast {
            animation: float 6s ease-in-out infinite;
        }

        @keyframes polaroidThrow {
            0% {
                opacity: 0;
                transform: translate3d(var(--throw-x, 0px), var(--throw-y, -90px), 0) scale(1.28) rotate(var(--throw-rot, 16deg));
            }
            65% {
                opacity: 1;
                transform: translate3d(0px, 4px, 0) scale(0.98) rotate(calc(var(--land-rot, 0deg) * 1.08));
            }
            100% {
                opacity: 1;
                transform: translate3d(0px, 0px, 0) scale(1) rotate(var(--land-rot, 0deg));
            }
        }
        .polaroid-throw {
            opacity: 0;
            animation: polaroidThrow 0.68s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            will-change: transform, opacity;
        }

        @keyframes tapeSlap {
            0% {
                opacity: 0;
                transform: scale(1.45) translateY(-10px) rotate(var(--tape-rot, -6deg));
            }
            70% {
                opacity: 0.96;
                transform: scale(0.95) translateY(1px) rotate(var(--tape-rot, -6deg));
            }
            100% {
                opacity: 0.92;
                transform: scale(1) translateY(0px) rotate(var(--tape-rot, -6deg));
            }
        }
        .tape-slap {
            opacity: 0;
            animation: tapeSlap 0.32s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            will-change: transform, opacity;
            clip-path: polygon(2% 0%, 98% 4%, 100% 30%, 96% 65%, 99% 100%, 3% 96%, 0% 62%, 4% 25%);
        }

        @media (prefers-reduced-motion: reduce) {
            .polaroid-throw {
                animation: none !important;
                opacity: 1 !important;
                transform: rotate(var(--land-rot, 0deg)) !important;
            }
            .tape-slap {
                animation: none !important;
                opacity: 0.92 !important;
                transform: rotate(var(--tape-rot, -6deg)) !important;
            }
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 10px;
        }
        ::-webkit-scrollbar-track {
            background: var(--whisk-sky);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--whisk-orange);
            border-radius: 10px;
            border: 3px solid var(--whisk-sky);
        }
        .font-handwritten {
            font-family: 'Caveat', cursive;
        }
    </style>
</head>
<body>
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
